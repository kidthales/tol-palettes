name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  no-agent-files:
    name: No tracked agent files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if agent or learnings paths are tracked
        run: |
          bad=$(git ls-files | grep -E '^(\.agents?/|\.gemini/|\.ai/|\.cursor/|\.claude/|docs/learnings/|AGENTS\.md$|GEMINI\.md$|CLAUDE\.md$)' || true)
          if [ -n "$bad" ]; then
            echo "Agent or learnings files must not be tracked:"
            echo "$bad"
            exit 1
          fi
          echo "OK: no agent or learnings files are tracked."

  test:
    name: Validate and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm test

  generated:
    name: Generated outputs are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run generate
      - name: Fail on drift
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "dist/ differs from a fresh generation. Run 'npm run generate' and commit the result."
            git status --porcelain dist
            git diff --stat dist
            exit 1
          fi
          echo "OK: dist/ is up to date."
      - name: Upload gallery artifact
        uses: actions/upload-artifact@v4
        with:
          name: tol-palettes-gallery
          path: dist/gallery/
          retention-days: 14

  # `npm run extract -- --check` compares the data with upstream and is meant for
  # scheduled or manual runs, not pull requests.

  notify:
    name: Notify
    if: always()
    needs: [no-agent-files, test, generated]
    runs-on: ubuntu-latest
    steps:
      - name: Post consolidated status to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK }}
          RESULTS: ${{ join(needs.*.result, ',') }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No webhook configured; skipping."; exit 0; fi
          case "$RESULTS" in
            *failure*) title="CI failed"; color=15088454 ;;
            *cancelled*) title="CI cancelled"; color=15088454 ;;
            *) title="CI passed"; color=4388484 ;;
          esac
          curl -sS -H "Content-Type: application/json" -d "{\"embeds\":[{\"title\":\"$title\",\"description\":\"$REPO ($REF)\\n[View run]($RUN_URL)\",\"color\":$color}]}" "$WEBHOOK"
