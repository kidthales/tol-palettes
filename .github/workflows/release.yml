name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate & test build
        run: |
          npm run lint
          npm run validate
          npm test

      - name: Publish to GitHub Packages (Idempotent)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          echo "Checking if ${PKG_NAME}@${PKG_VER} already exists on GitHub Packages..."
          if npm view "${PKG_NAME}@${PKG_VER}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "::notice ::Version ${PKG_VER} of ${PKG_NAME} is already published on GitHub Packages. Skipping publish step."
          else
            npm publish
            echo "Successfully published ${PKG_NAME}@${PKG_VER} to GitHub Packages."
          fi
