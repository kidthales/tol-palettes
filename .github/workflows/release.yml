name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify and publish (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  tag-guard:
    name: Verify Release Tag & Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.verify-tag.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify release tag matches project metadata versions
        id: verify-tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          TAG="${RELEASE_TAG:-${DISPATCH_TAG:-$REF_NAME}}"
          if [ -z "$TAG" ]; then
            echo "::error::No release tag or ref name found."
            exit 1
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[1-9][0-9]*)?$ ]]; then
            echo "::error::Release tag '$TAG' does not match required format '^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[1-9][0-9]*)?$'."
            exit 1
          fi
          PKG_VER=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${PKG_VER}"
          echo "Comparing release tag '$TAG' with expected tag '$EXPECTED_TAG'..."
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::Release tag '$TAG' does not match expected tag '$EXPECTED_TAG' (v + package.json version)."
            exit 1
          fi

          EXPECTED_PY_VER=$(PKG_VER="$PKG_VER" node --input-type=module -e "import { semverToPep440 } from './tools/sync-version.mjs'; console.log(semverToPep440(process.env.PKG_VER));")
          PY_VER=$(node -p 'require("fs").readFileSync("pyproject.toml", "utf8").match(/^version\s*=\s*["'\''"]([^"'\''"]+)["'\''"]/m)[1]')
          if [ "$PY_VER" != "$EXPECTED_PY_VER" ]; then
            echo "::error::pyproject.toml version '$PY_VER' does not match expected PEP 440 version '$EXPECTED_PY_VER' (from '$PKG_VER')."
            exit 1
          fi

          CFF_VER=$(node -p 'require("fs").readFileSync("CITATION.cff", "utf8").match(/^version:\s*([^\s\r\n]+)/m)[1]')
          if [ "$CFF_VER" != "$PKG_VER" ]; then
            echo "::error::CITATION.cff version '$CFF_VER' does not match package.json version '$PKG_VER'."
            exit 1
          fi

          GODOT_VER=$(node -p 'require("fs").readFileSync("dist/godot/addons/tol_palettes/plugin.cfg", "utf8").match(/^version="([^"]+)"/m)[1]')
          if [ "$GODOT_VER" != "$PKG_VER" ]; then
            echo "::error::dist/godot/addons/tol_palettes/plugin.cfg version '$GODOT_VER' does not match package.json version '$PKG_VER'."
            exit 1
          fi

          echo "Release tag '$TAG' matches version $PKG_VER (PEP 440: $EXPECTED_PY_VER) across package.json, pyproject.toml, CITATION.cff, and plugin.cfg."

  verify:
    name: Verify Release via CI Pipeline
    needs: [tag-guard]
    permissions:
      contents: read
      security-events: write
    uses: $/.github/workflows/ci.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

  publish-npm:
    name: Publish to npm Public Registry
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm (Idempotent with Provenance)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          DIST_TAG="latest"
          if [[ "$PKG_VER" == *-* ]]; then
            DIST_TAG="next"
          fi
          echo "Checking if ${PKG_NAME}@${PKG_VER} already exists on npm public registry..."
          if npm view "${PKG_NAME}@${PKG_VER}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "::notice ::Version ${PKG_VER} of ${PKG_NAME} is already published on npm. Skipping publish step."
          else
            npm publish --tag "$DIST_TAG" --provenance --access public
            echo "Successfully published ${PKG_NAME}@${PKG_VER} (tag: ${DIST_TAG}) to npm."
          fi

  publish-gpr:
    name: Publish to GitHub Packages
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # zizmor: ignore[use-trusted-publishing] GitHub Packages authenticates via GITHUB_TOKEN packages:write, not OIDC trusted publishing
      - name: Publish to GitHub Packages (Idempotent)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          DIST_TAG="latest"
          if [[ "$PKG_VER" == *-* ]]; then
            DIST_TAG="next"
          fi
          echo "Checking if ${PKG_NAME}@${PKG_VER} already exists on GitHub Packages..."
          if npm view "${PKG_NAME}@${PKG_VER}" version --registry=https://npm.pkg.github.com/ >/dev/null 2>&1; then
            echo "::notice ::Version ${PKG_VER} of ${PKG_NAME} is already published on GitHub Packages. Skipping publish step."
          else
            npm publish --tag "$DIST_TAG" --registry=https://npm.pkg.github.com/
            echo "Successfully published ${PKG_NAME}@${PKG_VER} (tag: ${DIST_TAG}) to GitHub Packages."
          fi

  publish-pypi:
    name: Publish to PyPI
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/p/tol-palettes
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tool
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build --outdir dist_pypi/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist_pypi/
          skip-existing: true

  attach-assets:
    name: Attach Release Asset Bundles
    needs: [verify]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    permissions:
      contents: write # gh release upload
      attestations: write # Sigstore attestation storage (actions/attest)
      id-token: write # Sigstore Fulcio OIDC signing (actions/attest)
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Generate game assets and package zip bundles
        run: |
          npm run generate:game
          npm run package:assets
          if ! test -z "$(git status --porcelain)"; then
            echo "::error::Generated game assets or zip bundles produced unexpected git working tree drift."
            git status --porcelain
            exit 1
          fi

      - name: Attest Build Provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/assets/*.zip
            dist/SHA256SUMS.txt
            dist/manifest.json
            dist/sri.json
            dist/css/tol.css
            dist/js/index.js
            dist/json/schemes.json
            dist/py/tol_palettes.py
          create-storage-record: false

      - name: Upload release assets to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG_NAME="${RELEASE_TAG:-${DISPATCH_TAG:-$REF_NAME}}"
          gh release upload "$TAG_NAME" \
            dist/assets/tol-palettes-godot.zip \
            dist/assets/tol-palettes-aseprite.zip \
            dist/assets/tol-palettes-gpl.zip \
            dist/SHA256SUMS.txt \
            dist/manifest.json \
            dist/sri.json \
            dist/css/tol.css \
            dist/js/index.js \
            dist/json/schemes.json \
            dist/py/tol_palettes.py \
            LICENSE \
            NOTICE \
            --clobber

  notify:
    name: Discord Release Notification
    needs: [tag-guard, verify, publish-npm, publish-gpr, publish-pypi, attach-assets]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      WEBHOOK_URL: ${{ secrets.DISCORD_CI_WEBHOOK }}
    steps:
      - name: Dispatch release status card to #dev-ci-builds
        if: env.WEBHOOK_URL != ''
        env:
          JOB_STATUS: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
          NPM_STATUS: ${{ needs.publish-npm.result }}
          GPR_STATUS: ${{ needs.publish-gpr.result }}
          PYPI_STATUS: ${{ needs.publish-pypi.result }}
          ASSETS_STATUS: ${{ needs.attach-assets.result || 'skipped' }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ needs.tag-guard.outputs.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TAG_NAME="${RELEASE_TAG:-${DISPATCH_TAG:-$REF_NAME}}"
          if [ "$JOB_STATUS" = "success" ]; then
            COLOR=2263091
            TITLE="🚀 Release Published — tol-palettes"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            COLOR=11184810
            TITLE="⚪ Release Cancelled — tol-palettes"
          else
            COLOR=15087942
            TITLE="❌ Release Failed — tol-palettes"
          fi

          jq -n \
            --arg title "$TITLE" \
            --arg url "$RUN_URL" \
            --arg repo "$REPO" \
            --arg tag "$TAG_NAME" \
            --arg sha "$SHA" \
            --arg npm "$NPM_STATUS" \
            --arg gpr "$GPR_STATUS" \
            --arg pypi "$PYPI_STATUS" \
            --arg assets "${ASSETS_STATUS:-skipped}" \
            --argjson color "$COLOR" \
            '{
              username: "kidthales CI",
              avatar_url: "https://kidthales.com/favicon-96x96.png",
              embeds: [{
                title: $title,
                url: $url,
                color: $color,
                fields: [
                  { name: "Repository", value: $repo, inline: true },
                  { name: "Tag / Ref", value: $tag, inline: true },
                  { name: "Commit", value: ($sha | .[0:7]), inline: true },
                  { name: "npm Registry", value: $npm, inline: true },
                  { name: "GitHub Packages", value: $gpr, inline: true },
                  { name: "PyPI", value: $pypi, inline: true },
                  { name: "Asset Bundles", value: $assets, inline: true }
                ],
                footer: {
                  text: "GitHub Actions • tol-palettes",
                  icon_url: "https://kidthales.com/favicon-96x96.png"
                }
              }]
            }' | curl -fsSL -H "Content-Type: application/json" -d @- "$WEBHOOK_URL" || echo "Discord notification failed (non-blocking)"
